name: Deploy Frontend with Docker

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t loh-frontend:latest .

      - name: Save Docker image to tar
        run: docker save loh-frontend:latest -o frontend.tar

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/id_rsa

      - name: Copy image to EC2
        run: |
          scp frontend.tar ubuntu@${{ secrets.SSH_HOST }}:/home/ubuntu/app/frontend/frontend.tar

      - name: Load + run image on EC2
        run: |
          ssh ubuntu@${{ secrets.SSH_HOST }} << 'EOF'
            docker load -i /home/ubuntu/app/frontend/frontend.tar
            docker stop frontend || true && docker rm frontend || true
            docker run -d --name frontend -p 80:80 loh-frontend:latest
          EOF
